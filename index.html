<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>나의 첫 HTML</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
            background-color: #f5f5f5;
        }

        h1 {
            color: #333;
        }

        p {
            color: #666;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background-color: #4f46e5;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #3730a3;
        }
    </style>
</head>
<body>

    <h1>안녕하세요! 👋</h1>
    <p>간단한 HTML 페이지입니다.</p>

    <button onclick="alert('버튼을 눌렀어요!')">
        클릭하기
    </button>

</body>
</html>
